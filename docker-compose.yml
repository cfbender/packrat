services:
  packrat:
    image: ghcr.io/cfbender/packrat:latest
    # To build locally instead: replace `image` with `build: .`
    ports:
      - "4100:4100"
    volumes:
      - packrat-data:/data
    environment:
      PACKRAT_PRICE_REFRESH_HOURS: "12"
    restart: unless-stopped

volumes:
  packrat-data:
