[package]
name = "packrat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
liblzma = { version = "0.4.9", features = ["static"] }
mimalloc = "0.1.52"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = ["derive", "macros", "runtime-tokio", "sqlite-bundled", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
